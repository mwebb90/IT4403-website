<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 3 - Exercise 3</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Exercise 3: Read JSON Values Using JavaScript/jQuery</h1>
    <h2>First Book</h2>
    <p id="firstTitle"></p>
    <p id="firstAuthor"></p>
    <p id="firstPrice"></p>
    <h2>All Books</h2>
    <div id="bookList"></div>
    <p id="totalBooks"></p>
    <script>
        $(document).ready(function () {
            const bookData = {
                "books": [
                    {
                        "title": "Web Development Basics",
                        "author": "Maya Lee",
                        "price": 29.99
                    },
                    {
                        "title": "Modern JavaScript",
                        "author": "Daniel Kim",
                        "price": 34.50
                    },
                    {
                        "title": "Understanding JSON",
                        "author": "Sofia Patel",
                        "price": 24.95
                    }
                ]
            };
            $("#firstTitle").text("Title: " + bookData.books[0].title);
            $("#firstAuthor").text("Author: " + bookData.books[0].author);
            $("#firstPrice").text("Price: $" + bookData.books[0].price.toFixed(2));
            let output = "";
            for (let i = 0; i < bookData.books.length; i++) {
                output += "<p><strong>" +
                    bookData.books[i].title +
                    "</strong> by " +
                    bookData.books[i].author +
                    "</p>";
            }
            $("#bookList").html(output);
            $("#totalBooks").text(
                "Total number of books: " + bookData.books.length
            );
        });
    </script>
</body>
</html>
