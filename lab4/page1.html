<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4 - User Albums</title>
</head>
<body>
  <h1>User Information</h1>
  <div id="userInfo">Loading user...</div>
  <h2>User Albums</h2>
  <ul id="albumList"></ul>
  <script>
    async function loadData() {
      try {
        const userResponse = await fetch(
          "https://jsonplaceholder.typicode.com/users/1"
        );
        if (!userResponse.ok) throw new Error("User request failed");
        const user = await userResponse.json();
        document.getElementById("userInfo").innerHTML = `
          <p><strong>Name:</strong> ${user.name}</p>
          <p><strong>Username:</strong> ${user.username}</p>
          <p><strong>Email:</strong> ${user.email}</p>
          <p><strong>Address:</strong>
            ${user.address.street},
            ${user.address.suite},
            ${user.address.city},
            ${user.address.zipcode}</p>
          <p><strong>Phone:</strong> ${user.phone}</p>
          <p><strong>Website:</strong> ${user.website}</p>
          <p><strong>Company:</strong> ${user.company.name}</p>
        `;
        const albumResponse = await fetch(
          `https://jsonplaceholder.typicode.com/albums?userId=${user.id}`
        );
        if (!albumResponse.ok) throw new Error("Album request failed");
        const albums = await albumResponse.json();
        const albumList = document.getElementById("albumList");
        albums.forEach(album => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = `page2.html?albumId=${album.id}`;
          link.textContent = album.title;
          item.appendChild(link);
          albumList.appendChild(item);
        });
      } catch (error) {
        document.getElementById("userInfo").textContent =
          "Unable to load data. Please try again.";
        console.error(error);
      }
    }
    loadData();
  </script>
</body>

</html>
