<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 2 - jQuery Event Handling</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Exercise 2: jQuery ready() and Event Handling</h1>
    <p id="paragraph1">This is the first paragraph.</p>
    <p id="paragraph2">This is the second paragraph.</p>
    <button id="button1">Hide First Paragraph</button>
    <button id="button2">Hide Second Paragraph</button>
    <script>
        $(document).ready(function() {
            $("#button1").click(function() {
                $("#paragraph1").hide();
            });
            $("#button2").click(function() {
                $("#paragraph2").hide();
            });
        });
    </script>
    <hr>
    <p><a href="index.html">Back to Lab 2</a></p>
</body>

</html>
