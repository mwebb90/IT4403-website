<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search | Open Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="bookshelf.html">My Bookshelf</a>
        </nav>
    </header>
    <main>
        <h1>Book Search</h1>
        <p class="subtitle">
            Discover your next favorite book.
        </p>
        <section class="search-section">
            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for books..."
                    aria-label="Search for books"
                    required
                >
                <button type="submit">
                    Search
                </button>
            </form>
        </section>
        <section>
            <h2>Search Results</h2>
            <div id="message" class="message">
                Enter a book title or keyword to begin.
            </div>
            <div id="bookResults" class="book-grid">
            </div>
        </section>
        <section class="pagination">
            <label for="resultsPerPage">
                Results per page:
            </label>
            <select id="resultsPerPage">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
            </select>
            <label for="pageNumber">
                Page:
            </label>
            <select id="pageNumber">
                <option value="1">1</option>
            </select>
        </section>
    </main>
    <footer>
        <p>
            Milestone 2 | Open Library API Project
        </p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
